<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>EnglishGate · B1 Gold Workbook</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/b2-lesson1-microflow-v1.css?v=1" />
  <style>
    body{margin:0;background:#f3f6fa;color:#0f172a}
    .northstar-preview-shell{max-width:1180px;margin:0 auto;padding:28px 22px 56px}
    #content>.b2-microflow{max-width:1080px;background:#fff;border:1px solid #dbe4ee;border-radius:18px;padding:14px 18px 40px;box-shadow:0 8px 28px rgba(15,23,42,.04)}
    .micro-history-nav{min-height:34px;display:flex;align-items:center;margin:4px 0}
    .micro-progress-meta{display:flex;justify-content:space-between;gap:16px;margin:6px 0 8px;color:#64748b;font-size:.76rem;font-weight:800}
    .micro-question-count{color:#64748b;font-size:.78rem;font-weight:800}
    .primary-btn,.ghost-btn{border-radius:12px;padding:10px 14px;font:inherit;font-weight:800;cursor:pointer}
    .primary-btn{border:1px solid #2563eb;background:#2563eb;color:#fff}
    .ghost-btn{border:1px solid #dbe4ee;background:#fff;color:#334155}
    .primary-btn:disabled{opacity:.45;cursor:not-allowed}
    @media(max-width:700px){
      .northstar-preview-shell{padding:12px 10px 40px}
      #content>.b2-microflow{border-radius:14px;padding:10px 12px 32px}
    }
  </style>
</head>
<body>
  <div class="northstar-preview-shell">
    <div id="content" aria-live="polite">
      <div style="max-width:900px;margin:0 auto;padding:32px;background:#fff;border:1px solid #dbe4ee;border-radius:18px">Loading B1 Gold Workbook…</div>
    </div>
  </div>
  <script src="/course-factory-b1-gold-l4-workbook.js?v=2"></script>
</body>
</html>
